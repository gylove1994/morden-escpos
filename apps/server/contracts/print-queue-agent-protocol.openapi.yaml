openapi: 3.1.0
info:
  title: Print Queue Agent Protocol
  description: |
    HTTP contract between the morden-escpos SaaS control plane and on-site
    Printer Agents. Device-token authentication is required for Printer Agent
    operations. Job lease/report cover the single-Printer raw enqueue path.
    Discovery reports let Printer Agents surface local endpoints for admin
    confirm/name in the console.
  version: 0.3.0-discovery
  license:
    name: BUSL-1.1
servers:
  - url: /api/protocol/v1
    description: Server-mounted Print Queue Agent Protocol prefix
tags:
  - name: PrinterAgent
    description: On-site Printer Agent device authentication, presence, and discovery
  - name: Jobs
    description: Job lease and outcome reporting for Printer Agents
paths:
  /health:
    get:
      tags: [PrinterAgent]
      operationId: getProtocolHealth
      summary: Protocol surface health (scaffold)
      description: |
        Scaffold-only probe confirming the Print Queue Agent Protocol mount is
        reachable. Does not require a device token.
      responses:
        '200':
          description: Protocol surface is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtocolHealthResponse'
  /printer-agents/heartbeat:
    post:
      tags: [PrinterAgent]
      operationId: postPrinterAgentHeartbeat
      summary: Printer Agent heartbeat
      description: |
        Authenticate with a Printer Agent device token and acknowledge presence.
        Successful authentication updates lastAuthenticatedAt. The console derives
        online/offline from that timestamp within PRINTER_AGENT_ONLINE_WINDOW_MS.
        Invalid or revoked tokens are rejected with 401.
      security:
        - printerAgentDeviceToken: []
      responses:
        '200':
          description: Device token accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrinterAgentHeartbeatResponse'
        '401':
          description: Missing, invalid, or revoked device token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtocolError'
  /printer-agents/discoveries:
    post:
      tags: [PrinterAgent]
      operationId: postPrinterAgentDiscoveries
      summary: Report discovered printer endpoints
      description: |
        Upsert local endpoints discovered by this Printer Agent (TCP / USB /
        Serial connection hints). Re-reporting the same endpoint refreshes
        lastSeenAt. Admins confirm and name Printers from these discoveries
        in the console.
      security:
        - printerAgentDeviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoveryReportRequest'
      responses:
        '200':
          description: Discoveries accepted and upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryReportResponse'
        '400':
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtocolError'
        '401':
          description: Missing, invalid, or revoked device token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtocolError'
  /jobs/lease:
    post:
      tags: [Jobs]
      operationId: postJobLease
      summary: Lease the next printable job
      description: |
        Short-poll for the next queued raw job owned by this Printer Agent.
        On success the job is leased exclusively until leaseExpiresAt. Expired
        leases are returned to queued before selection. When no work is
        available the server responds with 204.
      security:
        - printerAgentDeviceToken: []
      responses:
        '200':
          description: A job was leased exclusively to this Printer Agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobLeaseResponse'
        '204':
          description: No leasable job available
        '401':
          description: Missing, invalid, or revoked device token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtocolError'
  /jobs/{jobId}/report:
    post:
      tags: [Jobs]
      operationId: postJobReport
      summary: Report job printing / succeeded / failed
      description: |
        Advance a leased job through printing → succeeded | failed.
        failed reports MUST include errorMessage. Reports for unknown jobs,
        jobs owned by another Printer Agent, or illegal transitions return 409.
      security:
        - printerAgentDeviceToken: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobReportRequest'
      responses:
        '200':
          description: Job status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobReportResponse'
        '400':
          description: Invalid body (including missing errorMessage on failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtocolError'
        '401':
          description: Missing, invalid, or revoked device token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtocolError'
        '409':
          description: Illegal transition or job not leased to this Printer Agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtocolError'
components:
  schemas:
    ProtocolHealthResponse:
      type: object
      required: [status, protocol, edition]
      properties:
        status:
          type: string
          enum: [ok]
        protocol:
          type: string
          const: print-queue-agent-protocol
        edition:
          type: string
          enum: [cloud, self-hosted]
    PrinterAgentHeartbeatResponse:
      type: object
      required: [status, printerAgentId, organizationId]
      properties:
        status:
          type: string
          enum: [ok]
        printerAgentId:
          type: string
        organizationId:
          type: string
    DiscoveryEndpoint:
      type: object
      required: [connectionHints]
      properties:
        connectionHints:
          $ref: '#/components/schemas/ConnectionHints'
        suggestedName:
          type: string
          nullable: true
    DiscoveryReportRequest:
      type: object
      required: [endpoints]
      properties:
        endpoints:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/DiscoveryEndpoint'
    PrinterDiscovery:
      type: object
      required:
        - id
        - organizationId
        - printerAgentId
        - endpointKey
        - connectionHints
        - firstSeenAt
        - lastSeenAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        organizationId:
          type: string
        printerAgentId:
          type: string
        endpointKey:
          type: string
        connectionHints:
          $ref: '#/components/schemas/ConnectionHints'
        suggestedName:
          type: string
          nullable: true
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        confirmedPrinterId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DiscoveryReportResponse:
      type: object
      required: [status, printerAgentId, discoveries]
      properties:
        status:
          type: string
          enum: [ok]
        printerAgentId:
          type: string
        discoveries:
          type: array
          items:
            $ref: '#/components/schemas/PrinterDiscovery'
    ProtocolError:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
    ConnectionHints:
      oneOf:
        - type: object
          required: [transport, address, port]
          properties:
            transport:
              type: string
              const: tcp
            address:
              type: string
            port:
              type: integer
              minimum: 1
              maximum: 65535
        - type: object
          required: [transport, path]
          properties:
            transport:
              type: string
              const: usb
            path:
              type: string
        - type: object
          required: [transport, path]
          properties:
            transport:
              type: string
              const: serial
            path:
              type: string
            baudRate:
              type: integer
    LeasedJob:
      type: object
      required:
        - id
        - printerId
        - printerAgentId
        - status
        - payloadBase64
        - payloadByteLength
        - connectionHints
        - leaseExpiresAt
        - createdAt
      properties:
        id:
          type: string
        printerId:
          type: string
        printerAgentId:
          type: string
        status:
          type: string
          const: leased
        payloadBase64:
          type: string
          description: Raw ESC/POS bytes encoded as standard base64
        payloadByteLength:
          type: integer
          minimum: 1
        connectionHints:
          $ref: '#/components/schemas/ConnectionHints'
        leaseExpiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    JobLeaseResponse:
      type: object
      required: [job]
      properties:
        job:
          $ref: '#/components/schemas/LeasedJob'
    JobReportRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [printing, succeeded, failed]
        errorMessage:
          type: string
          description: Required when status is failed
    JobPublic:
      type: object
      required:
        - id
        - organizationId
        - printerId
        - printerAgentId
        - status
        - payloadBase64
        - payloadByteLength
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        organizationId:
          type: string
        printerId:
          type: string
        printerAgentId:
          type: string
        status:
          type: string
          enum: [queued, leased, printing, succeeded, failed]
        payloadBase64:
          type: string
        payloadByteLength:
          type: integer
        idempotencyKey:
          type: string
          nullable: true
        leaseExpiresAt:
          type: string
          format: date-time
          nullable: true
        errorMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        leasedAt:
          type: string
          format: date-time
          nullable: true
        printingAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
    JobReportResponse:
      type: object
      required: [job]
      properties:
        job:
          $ref: '#/components/schemas/JobPublic'
  securitySchemes:
    printerAgentDeviceToken:
      type: http
      scheme: bearer
      bearerFormat: device-token
      description: |
        Device token issued when a Printer Agent is registered or rotated.
        Tokens are stored hashed at rest; plaintext is shown once in the console.
